# Guided practice: a neutral posture, a small left-arm wave, and neutral again.
# Fixed pelvis; this goal does not demonstrate free-body balance.
# Every position array follows exactly the joint_names order below (radians).
# Times are cumulative seconds from the start of this one trajectory.
# This is a static ROS message example, separate from the homework mission.
